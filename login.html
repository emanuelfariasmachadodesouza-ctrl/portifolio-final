    <meta name="robots" content="noindex" />
    <title>Área restrita | Emanuel Farias</title>
    <meta
      name="description"
      content="Página de acesso simulado à área restrita do portfólio de Emanuel Farias para gerenciar projetos salvos localmente no navegador."
    />
    <meta property="og:title" content="Área restrita | Emanuel Farias" />
    <meta
      property="og:description"
      content="Acesso simulado ao painel de gerenciamento dos projetos do portfólio."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://MEU-SITE.vercel.app/img/logo.svg" />
    <meta property="og:url" content="https://MEU-SITE.vercel.app/login.html" />
    <link rel="canonical" href="https://MEU-SITE.vercel.app/login.html" />
    <link rel="icon" href="img/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css" />
    <!-- Biblioteca do Supabase (versão fixa). Precisa vir ANTES do login.js -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"
    ></script>
    <script type="module" src="js/login.js"></script>
  </head>
  <body>
    <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
    <header class="cabecalho">
      <nav class="navegacao container" aria-label="Navegação principal">
        <a class="marca" href="index.html" aria-label="Página inicial de Emanuel Farias"
          ><img src="img/logo.svg" alt="" width="42" height="42" /><span>Emanuel Farias</span></a
        >
        <div class="menu-desktop">
          <a href="index.html">Início</a><a href="quemsoueu.html">Quem sou eu</a
          ><a href="portfolio.html">Portfólio</a>
          <a
            class="link-cadeado ativo"
            href="login.html"
            aria-label="Entrar na área restrita"
            aria-current="page"
            ><svg aria-hidden="true" viewBox="0 0 24 24">
              <rect width="18" height="11" x="3" y="11" rx="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg
          ></a>
        </div>
        <details class="menu-mobile">
          <summary aria-label="Abrir menu">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M4 12h16M4 6h16M4 18h16"></path>
            </svg>
          </summary>
          <div class="menu-mobile-links">
            <a href="index.html">Início</a><a href="quemsoueu.html">Quem sou eu</a
            ><a href="portfolio.html">Portfólio</a>
            <a
              class="link-cadeado ativo"
              href="login.html"
              aria-label="Entrar na área restrita"
              aria-current="page"
              ><svg aria-hidden="true" viewBox="0 0 24 24">
                <rect width="18" height="11" x="3" y="11" rx="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg
              ><span>Área restrita</span></a
            >
          </div>
        </details>
      </nav>
    </header>

    <main id="conteudo" class="area-acesso container">
      <form class="formulario" id="formulario-login">
        <p class="rotulo">Acesso simulado</p>
        <h1>Área restrita</h1>
        <p class="subtitulo">Entre para cadastrar projetos neste navegador.</p>
        <div class="campo">
          <label for="usuario">Usuário</label>
          <input id="usuario" name="usuario" type="text" autocomplete="username" required />
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" autocomplete="current-password" required />
        </div>
        <button type="submit">Entrar</button>
        <p class="mensagem erro" id="mensagem-login" role="alert" aria-live="polite"></p>
      </form>
    </main>

    <footer class="rodape">
      <div class="conteudo-rodape container">
        <p>© 2025 Emanuel Farias</p>
        <ul class="links-sociais" aria-label="Contato e redes sociais">
          <li><a href="mailto:SEU_EMAIL_AQUI">E-mail</a></li>
          <li><a href="https://github.com/USUARIO_GITHUB">GitHub</a></li>
          <li><a href="https://www.linkedin.com/in/USUARIO_LINKEDIN">LinkedIn</a></li>
          <li><a href="https://www.instagram.com/USUARIO_INSTAGRAM">Instagram</a></li>
        </ul>
      </div>
    </footer>
  </body>
